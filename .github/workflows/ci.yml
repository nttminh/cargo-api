name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test -- --ci
      - run: npm run build

  migrations:
    name: Migrations and seeds (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      SEED_ADMIN_EMAIL: admin@cargo.local
      SEED_ADMIN_PASSWORD: DevAdmin123!
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Create one database and role per service
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f docker/postgres/init-databases.sql
        env:
          PGPASSWORD: postgres_ci_password
      - name: Migrate, revert, re-apply and check for entity drift (each service)
        # The drift check fails if an entity was changed without a matching migration.
        run: |
          for app in identity master-data shipments; do
            role=${app//-/_}
            export DB_USERNAME=$role DB_PASSWORD=${role}_dev_password DB_NAME=cargo_$role
            echo "::group::$app"
            npm run migration:run:$app
            npm run migration:revert:$app
            npm run migration:run:$app
            npm run migration:generate:$app -- apps/$app/src/database/migrations/PendingChanges --check
            echo "::endgroup::"
          done
      - name: Seed twice (must be idempotent)
        run: |
          export DB_USERNAME=identity DB_PASSWORD=identity_dev_password DB_NAME=cargo_identity
          npm run seed:identity && npm run seed:identity
          export DB_USERNAME=master_data DB_PASSWORD=master_data_dev_password DB_NAME=cargo_master_data
          npm run seed:master-data && npm run seed:master-data

  manifests:
    name: Render Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Render dev overlay
        run: kubectl kustomize k8s/overlays/dev > /dev/null
      - name: Render prod overlay
        run: |
          for f in k8s/overlays/prod/secrets/*.env.example; do cp "$f" "${f%.example}"; done
          kubectl kustomize k8s/overlays/prod > /dev/null

  system:
    name: Images + end-to-end (Docker Compose)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@v4

      # One image per service, tagged the way docker-compose.yml names them.
      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=gateway
          load: true
          tags: cargo-gateway:local
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Build identity image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=identity
          load: true
          tags: cargo-identity:local
          cache-from: type=gha,scope=identity
          cache-to: type=gha,mode=max,scope=identity
      - name: Build master-data image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=master-data
          load: true
          tags: cargo-master-data:local
          cache-from: type=gha,scope=master-data
          cache-to: type=gha,mode=max,scope=master-data
      - name: Build shipments image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=shipments
          load: true
          tags: cargo-shipments:local
          cache-from: type=gha,scope=shipments
          cache-to: type=gha,mode=max,scope=shipments

      - name: Images run as non-root
        run: |
          for app in gateway identity master-data shipments; do
            test "$(docker inspect -f '{{.Config.User}}' cargo-$app:local)" = node
          done

      - name: Start the stack (PostgreSQL, Kafka, 4 services)
        # Services run their migrations on start; --wait blocks until every healthcheck passes.
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Seed
        run: |
          docker compose run --rm -T identity node dist/apps/identity/src/database/seed.js
          docker compose run --rm -T master-data node dist/apps/master-data/src/database/seed.js

      - name: End-to-end tests through the gateway
        run: npm run test:e2e -- --ci

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  publish:
    name: Publish ${{ matrix.app }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, migrations, manifests, system]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, identity, master-data, shipments]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cargo-${{ matrix.app }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        # Same build as the tested one: layers come from the cache the system job filled.
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
