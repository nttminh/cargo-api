# Assumes ingress-nginx + cert-manager. Adjust class/annotations for your controller
# (AWS ALB, GKE, Traefik, ...).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargo-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.cargo.example.com]
      secretName: cargo-api-tls
  rules:
    - host: api.cargo.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cargo-api
                port:
                  name: http
