# Single-instance PostgreSQL for development clusters only.
# In production use a managed database (RDS, Cloud SQL, Azure Database) or an operator
# such as CloudNativePG, with one database per service.
# On first start it creates one database and one login role per service (see init SQL below).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init-databases.sql: |
    -- Local stacks only (docker compose, dev Kubernetes overlay): one database and one login role
    -- per service. A service can only reach its own database. Runs once, on an empty data volume.
    -- In production each service gets its own (managed) database created out of band.

    CREATE ROLE identity LOGIN PASSWORD 'identity_dev_password';
    CREATE DATABASE cargo_identity OWNER identity;

    CREATE ROLE master_data LOGIN PASSWORD 'master_data_dev_password';
    CREATE DATABASE cargo_master_data OWNER master_data;

    CREATE ROLE shipments LOGIN PASSWORD 'shipments_dev_password';
    CREATE DATABASE cargo_shipments OWNER shipments;

    -- Nobody else may connect to a service database.
    REVOKE CONNECT ON DATABASE cargo_identity FROM PUBLIC;
    REVOKE CONNECT ON DATABASE cargo_master_data FROM PUBLIC;
    REVOKE CONNECT ON DATABASE cargo_shipments FROM PUBLIC;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
