# One-off seed of the reference airports, seaports and carriers (published to Kafka through the outbox). Idempotent.
# Uses generateName, so create (not apply) it, once after the first deployment:
#   kubectl -n cargo create -f k8s/jobs/seed-master-data.yaml
# Set the image to the same tag as the running cargo-master-data Deployment (dev: cargo-master-data:dev).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: cargo-master-data-seed-
  labels:
    app.kubernetes.io/name: cargo-master-data-seed
    app.kubernetes.io/part-of: cargo
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cargo-master-data-seed
        app.kubernetes.io/component: job
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ghcr.io/nttminh/cargo-master-data:latest
          command: ["node", "dist/apps/master-data/src/database/seed.js"]
          envFrom:
            - configMapRef:
                name: cargo-config
            - configMapRef:
                name: cargo-master-data-config
            - secretRef:
                name: cargo-master-data-secrets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
