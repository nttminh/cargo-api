# One-off seed of the initial admin user. Idempotent.
# Uses generateName, so create (not apply) it, once after the first deployment:
#   kubectl -n cargo create -f k8s/jobs/seed-identity.yaml
# Set the image to the same tag as the running cargo-identity Deployment (dev: cargo-identity:dev).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: cargo-identity-seed-
  labels:
    app.kubernetes.io/name: cargo-identity-seed
    app.kubernetes.io/part-of: cargo
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cargo-identity-seed
        app.kubernetes.io/component: job
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ghcr.io/nttminh/cargo-identity:latest
          command: ["node", "dist/apps/identity/src/database/seed.js"]
          envFrom:
            - configMapRef:
                name: cargo-config
            - configMapRef:
                name: cargo-identity-config
            - secretRef:
                name: cargo-identity-secrets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
