# One-off seed (initial admin + reference airports/seaports/carriers). Idempotent.
# Uses generateName, so create (not apply) it, once after the first deployment:
#   kubectl -n cargo create -f k8s/jobs/seed-job.yaml
# Set the image to the same tag as the running Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: cargo-api-seed-
  labels:
    app.kubernetes.io/name: cargo-api-seed
    app.kubernetes.io/part-of: cargo
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ghcr.io/your-org/cargo-api:1.0.0
          command: ["node", "dist/database/seeds/run-seed.js"]
          envFrom:
            - configMapRef:
                name: cargo-api-config
            - secretRef:
                name: cargo-api-secrets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
