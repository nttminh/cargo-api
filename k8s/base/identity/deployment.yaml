# Identity service: users, login, access tokens.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-identity
  labels:
    app.kubernetes.io/name: cargo-identity
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: cargo-identity
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cargo-identity
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: cargo
    spec:
      serviceAccountName: cargo
      automountServiceAccountToken: false
      # Must exceed preStop sleep + app shutdown time.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user in the official image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cargo-identity
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cargo-identity

      initContainers:
        # Applies pending migrations to this service's own database. Guarded by a Postgres
        # advisory lock, so it is safe when many pods start at once.
        - name: migrate
          image: cargo-identity
          command: ["node", "dist/apps/identity/src/database/migrate.js"]
          envFrom:
            - configMapRef:
                name: cargo-config
            - configMapRef:
                name: cargo-identity-config
            - secretRef:
                name: cargo-jwt
            - secretRef:
                name: cargo-identity-secrets
            # Kafka credentials (SASL) where the cluster needs them; absent in dev.
            - secretRef:
                name: cargo-kafka
                optional: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: identity
          image: cargo-identity
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cargo-config
            - configMapRef:
                name: cargo-identity-config
            - secretRef:
                name: cargo-jwt
            - secretRef:
                name: cargo-identity-secrets
            # Kafka credentials (SASL) where the cluster needs them; absent in dev.
            - secretRef:
                name: cargo-kafka
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          lifecycle:
            # Give endpoints/ingress time to stop routing here before SIGTERM.
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
