# Ingress: only HTTP on 3000 (from the ingress controller / in-cluster clients).
# Egress: DNS + PostgreSQL only. Adjust the DB rule if you use a managed DB outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cargo-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cargo-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
