apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cargo

labels:
  - pairs:
      app.kubernetes.io/name: cargo-api
      app.kubernetes.io/part-of: cargo
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - cronjob-recompute-schedules.yaml
# The container image is set per overlay (`images:`); base uses the placeholder name "cargo-api".
