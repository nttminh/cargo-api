# Ingress: HTTP on 3000 from the ingress controller / in-cluster clients.
# Egress: DNS and the backend services only. The gateway has no database and no Kafka access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cargo-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cargo-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - port: 3000
          protocol: TCP
